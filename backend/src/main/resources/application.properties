spring.application.name=psicotestes

# ==========================================
# 1. BANCO DE DADOS
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/psicotestes}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:novasenha}

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. SEGURANCA
# ==========================================
api.security.token.secret=${JWT_SECRET:psicotestes-super-secret-key-desenvolvimento}

# ==========================================
# 4. INICIALIZACAO DE DADOS (SQL)
# ==========================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.data-locations=classpath:sql/users.sql,classpath:sql/bdi_ii.sql,classpath:sql/whoqol-bref.sql,classpath:sql/bss.sql

# ==========================================
# 5. EMAIL
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sistemapsicotestes@gmail.com
spring.mail.password=${MAIL_PASS:sua-senha-local-aqui}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# 6. INTELIGENCIA ARTIFICIAL (GEMINI)
# ==========================================
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=
gemini.api.key=${GEMINI_KEY:sua-chave-local-aqui}